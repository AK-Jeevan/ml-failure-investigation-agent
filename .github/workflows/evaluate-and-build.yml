name: Evaluate and build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install .
      - name: Run functional, red-team, and compatibility evaluation
        run: mlops-investigate --evaluate

  build-container:
    name: Build container image
    runs-on: ubuntu-latest
    needs: evaluate
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate AWS infrastructure template
        run: |
          python -m pip install cfn-lint
          cfn-lint infra/aws/stack.yaml
      - name: Build API, simulator, and dashboard image
        run: docker build --tag mlops-investigation-assistant:ci .
