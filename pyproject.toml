[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-investigation-agent"
version = "0.1.0"
description = "Evidence-first investigation runner for simulated ML production incidents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "gradio>=6.0,<7.0",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
mlops-investigate = "mlops_investigator.cli:main"
mlops-dashboard = "mlops_investigator.dashboard:main"

[tool.setuptools.packages.find]
where = ["src"]
